services:
  postgres:
    # Multi-arch PostGIS build — the official postgis/postgis tags are amd64
    # only, which fails on Apple Silicon. To use the official image instead:
    #   POSTGIS_IMAGE=postgis/postgis:17-3.5  (and add `platform: linux/amd64`)
    image: ${POSTGIS_IMAGE:-imresamu/postgis:17-3.5}
    container_name: poth-postgres
    environment:
      POSTGRES_USER: poth
      POSTGRES_PASSWORD: poth
      POSTGRES_DB: poth
    ports:
      - "5433:5432"
    volumes:
      - poth-pgdata:/var/lib/postgresql/data
      - ./backend/sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poth -d poth"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    container_name: poth-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    container_name: poth-api
    environment:
      DATABASE_URL: postgresql://poth:poth@postgres:5432/poth
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./web
    container_name: poth-web
    environment:
      # Server-side proxy target for /api/* — the browser never sees this, so
      # the compose service name is correct here. One public origin, no CORS.
      API_ORIGIN: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  poth-pgdata:
